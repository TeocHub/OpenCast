name: Compilar APK

on:
  push:
    branches: [ "main" ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Compilar
        run: ./gradlew assembleDebug --stacktrace

      - name: Renombrar APK
        run: cp app/build/outputs/apk/debug/app-debug.apk OpenCast.apk

      - name: Guardar como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: OpenCast
          path: OpenCast.apk

      - name: Publicar versión de prueba
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: dev
          name: OpenCast (versión de prueba)
          prerelease: true
          make_latest: false
          body: |
            Última compilación automática de `main` (${{ github.sha }}).
            Descarga **OpenCast.apk** desde el dispositivo e instálalo encima de la versión anterior.
          files: OpenCast.apk
